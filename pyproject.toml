[project]
name = "tutors-assistant"
version = "0.1.0"
description = "Telegram bot for private tutors schedule management"
authors = [
    {name = "Kit", email = "speedy.kit.8@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[job-queue]>=20.7",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.0",
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.0",
    "loguru>=0.7.0",
]

[project.scripts]
tutor-bot = "scripts.run_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Настройки uv (опционально)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
ignore = ["E501"]  # Игнорировать длину строк